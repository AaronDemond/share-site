
<!doctype html>
<html lang="en">
    <head>
        <title>Home</title>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <!-- Bootstrap CSS -->
	<!--<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous"> -->
        <link href="/static/bootstrap.min.css" rel="stylesheet">
        <link href="/static/styles.css" rel="stylesheet">
        <!-- CSS here -->
        <style type="text/css" media="screen">
body {
    padding: 4%
}

        </style>
    </head>
    <body>
        <header>

        </header>
        
        <main>
            <h1>Create A New Company</h1>

            <div class="row">

                <div class="col-sm-12">
                    <a href="/" >Home</a> / <a href="/entities/" >Entities</a> / Create a company
                </div>
            </div>

            {% if alert %}
            <div class="row">
                <div class="col-sm-5">

                    <div class="alert alert-{{ error_type }} alert-dismissible fade show" role="alert">

                        {{alert}}

                    </div>
                </div>
                <div class="col-sm-7">
                    <button type="button" class="btn btn-danger close alert-button">Close</button>

                </div>
            </div>
            {% endif %}
                    {% if edit == True %}
                    <form  method ="POST" action="/entities/" />
                    {% else %}
                    <form  method ="POST"/>
                    {% endif %}
                        <input type="hidden" name="entity_id" value="{{entity.pk}}">
                        <input type="hidden" name="type" value="{{type}}">
            <div class="row">

                        {% csrf_token %}
                        <div class="row">
<div class="col-sm-6">
                            <br />
                            <div class="input-group">
                                <span class="input-group-text">Name</span>
                                <input type="text" autocomplete="off" class="form-control" name = "Name" id = "Name" value="{{entity.Name}}" placeholder="Name of Company">
                                
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <br />
                            <div class="input-group">
                                <span class="input-group-text">Incorporation Date</span> 
                                <input type="date" class="form-control" value="{{entity.Date}}" name="date" id=""/> 
                                <input type="time" class="form-control" value="{{entity.Time}}" name="time" 
                                step="1" id=""/> 
                            </div>

                        </div></div>
                        <div class="row">
<div class="col-sm-12" style="padding-top: 20px;">
                            <div class="input-group">

                                <span class="input-group-text">Address</span>
                                <input type="text" autocomplete="off" class="form-control" name = "Address" id = "Name" value="{{entity.Address}}" placeholder="Company address">
                            </div>
                        </div></div>
                        <div class="col-sm-12">
                            <button class="btn btn-success" type="submit" style="margin-top: 20px;">Submit</button>
                                    <a class="btn btn-warning" style="margin-top: 20px;"href="/entities/"  >Cancel</a>
                        </div>
            </div>
                    </form>


        </main>
        <footer>

        </footer>
        <!-- Optional JavaScript -->
        <!-- jQuery first, then Popper.js, then Bootstrap JS -->
        <!--- <script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-ygbV9kiqUc6oa4msXn9868pTtWMgiQaeYH7/t7LECLbyPA2x65Kgf80OJFdroafW" crossorigin="anonymous"></script> -->
        <script type = "text/javascript" src="/static/jquery.min.js"></script>
        <script type = "text/javascript" src="/static/popper.1.14.7.js"></script>
        <script type = "text/javascript" src="/static/bootstrap.5.js"></script>
        <script type = "text/javascript">
            $(".close").click(function(){
                $(".alert").hide();
                $(".alert-button").hide();
            });
        </script>
    </body>
</html>
