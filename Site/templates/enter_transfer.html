
<!doctype html>
<html lang="en">
  <head>
	<title>Enter Transfer</title>
	<!-- Required meta tags -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous">
	<!-- CSS here -->
    <style type="text/css" media="screen">
        body {
            padding: 4%
        }


        #companylist{
            padding-top: 20px;
        }

        #company_listing{
            padding-botton: 10px;
        }

    </style>
  </head>
  <body>
	<header>

	</header>
	<main>
                <h1>Enter a Transfer</h1>
                <div class="row">
                    <div class="col-sm-12">
                        
       <a href="/" >Home</a> / <a href="/companies" >Companies</a> / Enter Transfer
                    </div>
                    
                </div>
        <div class="row">
            <form method="POST">

                {% csrf_token %}
                <hr>
                <div id="transferedFrom"> 
                    <h3>What entity are the shares coming from</h3>
                    <div class="col-sm-12">
                       <button class="btn btn-primary" id="fromCompany">Company</button> 
                       <button class="btn btn-primary" id="fromPerson">Person</button> 
                    </div>
                </div>
            </form>
            

        </div>

</main>
	<footer>

	</footer>
	<!-- Optional JavaScript -->
	<!-- jQuery first, then Popper.js, then Bootstrap JS -->
	<script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-ygbV9kiqUc6oa4msXn9868pTtWMgiQaeYH7/t7LECLbyPA2x65Kgf80OJFdroafW" crossorigin="anonymous"></script>
<script type = "text/javascript">
    $("#fromCompany").click(function(){
        $.ajax({url: "/ajax/fromCompany/", async:false, success: function(result){
            $("#transferedFrom").html(result);
        }});
    });
  </script>
  </body>
</html>
