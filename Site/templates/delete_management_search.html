
{% load extras %}
                <div class="col-sm-12">
                    <div class="input-group" style="padding-bottom: 20px;">
                        <input type="text" class="form-control" name = "query" id = "deleteQuery" value="{{query}}" placeholder="Search for..">
                        <span class="input-group-btn">
                            <button class="btn btn-success" onclick="searchRemove(1)" type="button">Go!</button>
                        </span>
                    </div>
                </div>
                <div class="row itemListContainer">
                {% for m in managers %}
                   <div class="row listItem">
                       <div class="col-sm-4 itemInList">
                           {{m}} 
                       </div> 
                       <div class="col-sm-8 buttonsInList">
                          <button type="button" class="btn btn-primary" 
                                                 onclick="selectDeletion({{m.id}},'{{m}}')">Select</button> 
                       </div> 
                   </div>
               {% endfor %}
                </div>
<div class="row" style="background-color: white">
                <div class="col-sm-3">
                    {% if page > 1 %}
                    <button class="btn btn-primary" style="margin-top: 20px;" onclick="searchRemove({{page|changeValue:'-1'}})" type="button"><</button>
                    {% else %}
                    <button class="btn btn-primary disabled" type="button" style="margin-top: 20px;"><</button>
                    {% endif %}

                    {% if hasNextPage == True %}
                    <button class="btn btn-primary" style="margin-top: 20px;" 
                        onclick="searchRemove({{page|changeValue:'1'}})" type="button">></button>
                    {% else %}
                    <button class="btn btn-primary disabled" style="margin-top: 20px;">></button>
                    {% endif %}
                </div> 
            </div>
