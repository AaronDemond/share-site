<!doctype html>
<html lang="en">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous">
        <!-- CSS here -->
        <link rel="stylesheet" href="style.css">
        <style type="text/css" media="screen">
body {
    padding: 4%
}

        </style>
    </head>
    <body>
        <header>

        </header>
        <main>
            <h1>Authorize Shares</h1>
            <div class="row">

                <div class="col-sm-12">
                    <a href="/" >Home</a> / <a href="/companies" >Companies</a> / Issue Shares
                </div>
            </div>
            {% if alert %}
            <div class="row">
                <div class="col-sm-5">

                    <div class="alert alert-{{ error_type }} alert-dismissible fade show" role="alert">

                        {{alert}}

                    </div>
                </div>
                <div class="col-sm-7">
                    <button type="button" class="btn btn-danger close alert-button">Close</button>

                </div>
            </div>
            {% endif %}
            <div class="row">

                <div class="col-lg-12">
                    {{company}}
                    <hr> 
                </div>
            </div>
            <div class="row">

                <div class="col-lg-12">
                    {% for key, value in share_classes_authorized.items %}
                    {{key}} : {{value}}
                    </br>
                    {% endfor %}
                    <hr>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-12">
                    <form  method ="POST" />

                        {% csrf_token %}
                        <div class="row">

                            <div class="col-sm-6">

                                <div class="input-group">
                                    <span class="input-group-text">Date</span> 
                                    <input type="date" class="form-control" value="" name="date" id=""/> 
                                    <input type="time" class="form-control" value="" name="time" id=""/> 
                                </div>
                            </div>

                            <div class="col-sm-6">
                                <div class="input-group">
                                    <input type="text" class="form-control" name = "Ammount" id = "search_string" value="" placeholder="Ammount">
                                    <select class="custom-select" name = "ShareClass" id="inputGroupSelect01">
                                        <option selected>Choose...</option>
                                        {% for sc in share_classes %}
                                        <option value="{{sc.id}}">{{sc}}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="col-sm-6" style="margin-top: 20px">
                                <div class="input-group">
                                    <span class="input-group-text">Par value</span> 
                                    <input type="text" class="form-control" name = "parValue"
                                                       value="" placeholder="Par value">
                                </div>
                            </div>
                            <div class="col-sm-6">
                            </div>
                            <div class="col-sm-6">
                                <span class="input-group-btn">
                                    <button class="btn btn-success browse-btn-fix" 
                                        type="submit" style="margin-top: 20px">Go!</button>
                                </span>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>
        <footer>

        </footer>
        <!-- Optional JavaScript -->
        <!-- jQuery first, then Popper.js, then Bootstrap JS -->
        <script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-ygbV9kiqUc6oa4msXn9868pTtWMgiQaeYH7/t7LECLbyPA2x65Kgf80OJFdroafW" crossorigin="anonymous"></script>
        <script type = "text/javascript">
            $(".close").click(function(){
                $(".alert").hide();
                $(".alert-button").hide();
            });
        </script>
    </body>
</html>
