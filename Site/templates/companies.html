<!doctype html>
<html lang="en">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous">
        <!-- CSS here -->
        <link rel="stylesheet" href="style.css">
        <style type="text/css" media="screen">
        body {
            padding: 4%
        }
        #companylist{
            padding-top: 20px;
        }

        #company_listing{
            padding-botton: 10px;
        }

        </style>
    </head>
    <body>
        <header>
        </header>
        <main>
            <h1>Find a Company</h1>
            <div class="row">
                <div class="col-sm-12">
                    <a href="/" >Home</a> / Companies
                </div>

                {% if alert %}
                <div class="row">
                    <div class="col-sm-5" style="padding-top: 20px;">

                        <div class="alert alert-{{ error_type }} alert-dismissible fade show" role="alert">

                            {{alert}}

                        </div>
                    </div>
                    <div class="col-sm-7" style="padding-top: 20px;">
                        <button type="button" class="btn btn-danger close alert-button">Close</button>

                    </div>
                </div>
                {% endif %}

                <div class="col-lg-12">
                    <form action ="{% url 'companies' %}" method ="GET" />
                        <input type="hidden" name="search_type" value="search">
                        <div class="col-xs-12">
                            <br />
                            <div class="input-group">
                                <input type="text" class="form-control" name = "query" id = "search_string" value="" placeholder="Search for..">
                                <span class="input-group-btn">
                                    <button class="btn btn-success browse-btn-fix" type="submit">Go!</button>
                                </span>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="row" id="companylist">
                {% for company in companies %}
                <div class="col-sm-3">
                    {{company}}

                </div>
                <div class="col-sm-9" style="padding-bottom: 10px;">
                    <a  href="/companies/{{company.id}}/issue">Authorize Shares</a> |
                    <a  href="/companies/{{company.id}}/enterTransfer">Enter Transfer</a> |
                    <a  href="/companies/{{company.id}}/registers">Registers</a> |
                    <a  href="/companies/{{company.id}}/shareholdersLedger">Shareholders Ledger</a> |
                    <a  href="/companies/{{company.id}}/changeManagement">Change Management</a> |
                    <a  href="/companies/{{company.id}}/transfers">Transfers</a>
                    <!-- class="btn btn-primary" role="button" -->

                </div>
                {% endfor %}
            </div>	
        </main>
        <footer>

        </footer>
        <!-- Optional JavaScript -->
        <!-- jQuery first, then Popper.js, then Bootstrap JS -->
        <script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-ygbV9kiqUc6oa4msXn9868pTtWMgiQaeYH7/t7LECLbyPA2x65Kgf80OJFdroafW" crossorigin="anonymous"></script>
        <script type = "text/javascript">
            $(".close").click(function(){
                $(".alert").hide();
                $(".alert-button").hide();
            });
        </script>
    </body>
</html>
