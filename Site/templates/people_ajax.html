<style type="text/css" media="screen">
</style>
<div id="peopleHolder" class="row">

                                    <div class="input-group" style="padding-bottom: 20px">
					<input type="text" class="form-control" name = "query" id = "search_string" value="" placeholder="Search for..">
                                        <span class="input-group-btn">
                                        <button class="btn btn-success" onclick="search()">Go!</button>
                                        </span>
                                    </div>

    {% for person in people %}
    <div class="row personRow">
        
        <div class="col-sm-3">
            {{person}} 
        </div>
        <div class="col-sm-9" style="padding-bottom: 20px;">
            <button class="btn btn-primary" rol="button" onclick="select({{person.id}}, '{{person}}')">select</button> 
        </div>
    </div>
        {% endfor %}
</div>
<script type = "text/javascript">
    function select(person_id, person_name) {
        //$("#fromHolder").html('<input type="text" class = "form-control" name = "FromCompany" value = '+company_id+'>');
        if (direction=="To") {
        $("#peopleHolder").html('<input type="hidden" name="toPerson", value='+person_id+'> <p> {{direction}} '+person_name+' </p>');
        } else {
        $("#peopleHolder").html('<input type="hidden" name="fromPerson", value='+person_id+'> <p> {{direction}} '+person_name+' </p>');
        return false;
        }
    }
    function search() {
        var search_string = $("#search_string").val()
        $.ajax({url: '/ajax/personSearch/?direction='+direction+'&query='+search_string, async:false, success: function(result){
            $("#q3").html(result);
            return false;
        }});
        return false;

    }
</script>
