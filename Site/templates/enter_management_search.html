{% load extras %}
<div class="row itemListContainer">
    {% for participant in participants %}
        {% if participant.LinkedPerson %}
            <div class="row listItem">
                <div class="col-sm-9 col-9 itemInList">
                    {{participant.LinkedPerson}}
                </div>    
                
                <div class="col-sm-3 col-3 buttonsInList btnsFloatRightContainer">

<button class="selectAdd btn btn-primary"  
                                        linkedId="{{participant.LinkedPerson.id}}"
                                        linkedPerson="{% for char in participant.LinkedPerson.Name %}{% if char == '"' %}&quot;{% else %}{{char}}{% endif %}{% endfor %}"
                                        _type = "Person" type="button">select</button>

                     
                </div>
            </div>
        {% endif %}
    {% endfor %}
</div>

<div class="row">
                <div class="col-sm-3">
                    {% if page > 1 %}
                    <button class="btn btn-primary" style="margin-top: 10px;" onclick="search({{page|changeValue:'-1'}})" type="button"><</button>
                    {% else %}
                    <button class="btn btn-primary disabled" type="button" style="margin-top: 10px;"><</button>
                    {% endif %}

                    {% if hasNextPage == True %}
                    <button class="btn btn-primary" style="margin-top: 10px;" 
                        onclick="search({{page|changeValue:'1'}})" type="button">></button>
                    {% else %}
                    <button class="btn btn-primary disabled" style="margin-top: 10px;">></button>
                    {% endif %}
                </div> 
</div> 

    <script type="text/javascript">
        $(".selectAdd").click(function(e){
           console.log("TEST");
            var linkedId = $(this).attr("linkedId");
            var linkedPerson = $(this).attr("linkedPerson");
            var type = $(this).attr("_type");
            selectPerson(linkedId, linkedPerson, type);
        });
    </script>
